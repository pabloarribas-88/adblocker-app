<!doctype html>
<html lang="en">
<head>

<title>AdNil — Stay protected</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<body>
  <div class="device">
    <div class="screen" data-node-id="1:129">
      <div class="status-bar">
        <span class="time">9:41</span>
        <span class="indicators">5G  100%</span>
      </div>

      <div class="content gap-16">
        <div class="hero" style="height:300px;align-items:stretch;justify-content:flex-start;padding:48px 18px 18px;gap:10px;">
          <div class="notif">
            <div class="mark mark-sm"><img src="assets/icons/65484.svg" width="19" height="19" alt="" /></div>
            <div class="notif-text">
              <h4>AdNil</h4>
              <p>Safari blocking is off. Tap to turn protection back on.</p>
            </div>
          </div>
          <div class="notif dim">
            <div class="mark mark-sm"><img src="assets/icons/65484.svg" width="19" height="19" alt="" /></div>
            <div class="notif-text">
              <h4>AdNil</h4>
              <p>Your yearly plan renews in 7 days.</p>
            </div>
          </div>
        </div>

        <div class="icon-chip" style="width:40px;height:40px;border-radius:11px;">
          <img src="assets/icons/8c1ac.svg" width="22" height="22" alt="" />
        </div>

        <h1 class="display-lg">Stay protected</h1>
        <p class="body-text">We'll only notify you when something needs your attention: protection turned off, renewal reminders and important updates.</p>
      </div>

      <div class="footer">
        <a class="btn btn-primary" href="05-paywall.html">Enable Notifications</a>
        <a class="btn btn-ghost" href="05-paywall.html">Not now</a>
