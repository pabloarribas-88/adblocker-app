<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>
(function(){
  try {
    var raw = localStorage.getItem('adnil-customize');
    if (raw) {
      var s = JSON.parse(raw);
      var root = document.documentElement;
      var FONT_STACKS = {inter:"'Inter', sans-serif", 'space-grotesk':"'Space Grotesk', sans-serif", sora:"'Sora', sans-serif", 'plus-jakarta':"'Plus Jakarta Sans', sans-serif", manrope:"'Manrope', sans-serif"};
      if (s.font) root.style.setProperty('--font-sans', (FONT_STACKS[s.font]||FONT_STACKS.inter) + ", sans-serif");
      if (s.primary) root.style.setProperty('--brand-primary', s.primary);
      if (s.button) root.style.setProperty('--button-bg', s.button);
      if (s.background) root.style.setProperty('--surface-base', s.background);
      if (s.theme) root.setAttribute('data-theme', s.theme);
    }
  } catch(e) {}
})();
</script>
<title>AdNil — Turn on in Safari</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/app.css" />
<link rel="stylesheet" href="styles/customize.css" />
</head>
<body>
  <div class="device">
    <div class="screen" data-node-id="1:282">
      <div class="status-bar">
        <span class="time">9:41</span>
        <span class="indicators">5G  100%</span>
      </div>

      <div class="content gap-16">
        <p class="eyebrow">STEP 2 OF 2</p>
        <h1 class="display-lg">Turn on AdNil in Safari</h1>
        <p class="body-text">One last step. It takes about 20 seconds.</p>

        <div class="steps-card">
          <div class="step">
            <span class="step-num">1</span>
            <p>Tap Open Settings below</p>
          </div>
          <div class="step">
            <span class="step-num">2</span>
            <p>Go to Apps → Safari → Extensions</p>
          </div>
          <div class="step">
            <span class="step-num">3</span>
            <p>Tap AdNil and turn on Allow Extension</p>
          </div>
          <div class="settings-preview">
            <div class="mark mark-pill"><img src="assets/icons/a20a6.svg" width="17" height="17" alt="" /></div>
            <p>AdNil</p>
            <img src="assets/icons/7fd83.svg" width="51" height="31" alt="" />
          </div>
          <div class="step">
            <span class="step-num">4</span>
            <p>Come back to AdNil. We'll check it worked.</p>
          </div>
        </div>

        <button type="button" class="watch-guide">
          <img src="assets/icons/03cd7.svg" width="16" height="16" alt="" />
          Watch a 20-second guide
        </button>
      </div>

      <div class="footer">
        <a class="btn btn-primary" href="09-activation-verified.html">Open Settings</a>
        <a class="btn btn-ghost" href="12-dashboard-action-needed.html">I'll do this later</a>
      </div>
    </div>
  </div>

  <script src="scripts/customize.js"></script>
  <script src="scripts/nav.js"></script>
</body>
</html>
