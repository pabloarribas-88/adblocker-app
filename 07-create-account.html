<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AdNil — Secure your account</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/app.css" />
</head>
<body>
  <div class="device">
    <div class="screen" data-node-id="1:249">
      <div class="status-bar">
        <span class="time">9:41</span>
        <span class="indicators">5G  100%</span>
      </div>

      <div class="content gap-14">
        <h1 class="display-lg">Secure your account</h1>
        <p class="body-text">Sign in on a new iPhone and manage your subscription anytime.</p>

        <a class="btn btn-dark" href="08-enable-safari.html">Continue with Apple</a>
        <a class="btn btn-outline" href="08-enable-safari.html">Continue with Google</a>

        <div class="divider-row">
          <span class="line"></span>
          <span>or use your checkout email</span>
          <span class="line"></span>
        </div>

        <div class="field filled" style="width:100%;">
          <label>Email (from checkout)</label>
          <input type="email" value="alex@example.com" readonly />
        </div>
        <div class="field" style="width:100%;">
          <label>Create password</label>
          <input type="password" placeholder="At least 8 characters" />
        </div>
        <div class="field" style="width:100%;">
          <label>First name (optional)</label>
          <input type="text" placeholder="First name" />
        </div>

        <label class="checkbox-row" style="cursor:pointer;">
          <span class="box"></span>
          <span>Send me tips and offers from iolo</span>
        </label>
      </div>

      <div class="footer">
        <a class="btn btn-primary" href="08-enable-safari.html">Create Account</a>
      </div>
    </div>
  </div>

  <script src="scripts/nav.js"></script>
</body>
</html>
