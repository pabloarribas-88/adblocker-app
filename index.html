<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdBlocker App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">🛡️</span>
        <span class="brand-name">AdBlocker</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="masterToggle" checked />
        <span class="slider"></span>
      </label>
    </header>

    <section class="status-card" id="statusCard">
      <div class="status-icon" id="statusIcon">🛡️</div>
      <div class="status-text">
        <h1 id="statusTitle">Protected</h1>
        <p id="statusSubtitle">Blocking ads on this site</p>
      </div>
    </section>

    <section class="stats">
      <div class="stat">
        <span class="stat-value" id="siteBlockedCount">0</span>
        <span class="stat-label">Blocked on this site</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="totalBlockedCount">0</span>
        <span class="stat-label">Blocked total</span>
      </div>
    </section>

    <section class="site-row">
      <span class="site-label">example.com</span>
      <button class="link-btn" id="siteToggle">Pause on this site</button>
    </section>

    <section class="filters">
      <h2>Filter lists</h2>
      <ul class="filter-list" id="filterList">
        <li class="filter-item">
          <label>
            <input type="checkbox" checked data-filter="ads" />
            <span>Ads</span>
          </label>
        </li>
        <li class="filter-item">
          <label>
            <input type="checkbox" checked data-filter="trackers" />
            <span>Trackers</span>
          </label>
        </li>
        <li class="filter-item">
          <label>
            <input type="checkbox" data-filter="social" />
            <span>Social widgets</span>
          </label>
        </li>
        <li class="filter-item">
          <label>
            <input type="checkbox" data-filter="popups" />
            <span>Popups</span>
          </label>
        </li>
      </ul>
    </section>

    <footer class="app-footer">
      <button class="secondary-btn" id="resetBtn">Reset counters</button>
      <span class="version">Prototype v0.1</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
