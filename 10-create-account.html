<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>
(function(){
  try {
    var raw = localStorage.getItem('adnil-customize');
    if (raw) {
      var s = JSON.parse(raw);
      var root = document.documentElement;
      var FONT_STACKS = {inter:"'Inter', sans-serif", 'space-grotesk':"'Space Grotesk', sans-serif", sora:"'Sora', sans-serif", 'plus-jakarta':"'Plus Jakarta Sans', sans-serif", manrope:"'Manrope', sans-serif", 'bai-jamjuree':"'Bai Jamjuree', sans-serif"};
      if (s.font) root.style.setProperty('--font-sans', (FONT_STACKS[s.font]||FONT_STACKS.inter) + ", sans-serif");
      if (s.primary) root.style.setProperty('--brand-primary', s.primary);
      if (s.button) root.style.setProperty('--button-bg', s.button);
      if (s.background) root.style.setProperty('--surface-base', s.background);
      if (s.theme) root.setAttribute('data-theme', s.theme);
    }
  } catch(e) {}
})();
</script>
<title>AdNil — Secure your account</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Bai+Jamjuree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/app.css" />
<link rel="stylesheet" href="styles/customize.css" />
</head>
<body>
  <div class="device">
    <div class="screen" data-node-id="1:249">
      <div class="status-bar">
        <span class="time">9:41</span>
        <span class="indicators">5G  100%</span>
      </div>

      <div class="content gap-14">
        <h1 class="display-lg">Secure your account</h1>
        <p class="body-text">Sign in on a new iPhone and manage your subscription anytime.</p>

        <a class="btn btn-dark" href="11-enable-safari.html">Continue with Apple</a>
        <a class="btn btn-outline" href="11-enable-safari.html">Continue with Google</a>

        <div class="divider-row">
          <span class="line"></span>
          <span>or use your checkout email</span>
          <span class="line"></span>
        </div>

        <div class="field filled" style="width:100%;">
          <label>Email (from checkout)</label>
          <input type="email" value="alex@example.com" readonly />
        </div>
        <div class="field" style="width:100%;">
          <label>Create password</label>
          <input type="password" placeholder="At least 8 characters" />
        </div>
        <div class="field" style="width:100%;">
          <label>First name (optional)</label>
          <input type="text" placeholder="First name" />
        </div>

        <label class="checkbox-row" style="cursor:pointer;">
          <span class="box"></span>
          <span>Send me tips and offers from iolo</span>
        </label>
      </div>

      <div class="footer">
        <a class="btn btn-primary" href="11-enable-safari.html">Create Account</a>
      </div>
    </div>
  </div>

  <script src="scripts/customize.js"></script>
  <script src="scripts/nav.js"></script>
</body>
</html>
