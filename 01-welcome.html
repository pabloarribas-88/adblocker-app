<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>
(function(){
  try {
    var raw = localStorage.getItem('adnil-customize');
    if (raw) {
      var s = JSON.parse(raw);
      var root = document.documentElement;
      var FONT_STACKS = {inter:"'Inter', sans-serif", 'space-grotesk':"'Space Grotesk', sans-serif", sora:"'Sora', sans-serif", 'plus-jakarta':"'Plus Jakarta Sans', sans-serif", manrope:"'Manrope', sans-serif"};
      if (s.font) root.style.setProperty('--font-sans', (FONT_STACKS[s.font]||FONT_STACKS.inter) + ", sans-serif");
      if (s.primary) root.style.setProperty('--brand-primary', s.primary);
      if (s.button) root.style.setProperty('--button-bg', s.button);
      if (s.background) root.style.setProperty('--surface-base', s.background);
      if (s.theme) root.setAttribute('data-theme', s.theme);
    }
  } catch(e) {}
})();
</script>
